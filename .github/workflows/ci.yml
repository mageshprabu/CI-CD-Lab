
name: My First CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-website:
    name: Validate HTML file
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Display success message
        run: echo "CI passed - index.html exists"
